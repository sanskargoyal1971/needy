version: '3.8'

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-needy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-needy}
      POSTGRES_DB: ${POSTGRES_DB:-needy}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needy"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-needy}:${POSTGRES_PASSWORD:-needy}@postgres:5432/${POSTGRES_DB:-needy}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_that_should_be_changed}
      - KYC_CALLBACK_SECRET=${KYC_CALLBACK_SECRET:-dummy_secret_that_must_be_32_characters_long}
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  landing:
    build:
      context: .
      dockerfile: packages/landing/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "80:3000"

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    restart: always
    ports:
      - "3000:80"

volumes:
  redis-data:
  pg-data:
