version: '3.8'

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: always
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-needy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-needy}
      POSTGRES_DB: ${POSTGRES_DB:-needy}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U needy"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-needy}:${POSTGRES_PASSWORD:-needy}@postgres:5432/${POSTGRES_DB:-needy}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_that_should_be_changed}
      - KYC_CALLBACK_SECRET=${KYC_CALLBACK_SECRET:-dummy_secret_that_must_be_32_characters_long}
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The single Next.js app: marketing, signup/KYC, requester, helper and admin.
  # NEXT_PUBLIC_* are inlined by `next build`, so the API origin is a BUILD arg — setting it
  # as a runtime `environment:` entry would have no effect on the compiled bundle.
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "80:3000"
    depends_on:
      - backend

volumes:
  redis-data:
  pg-data:
