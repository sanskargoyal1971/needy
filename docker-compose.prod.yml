# Production stack: Caddy (TLS) → web + backend → Postgres + Redis.
#
# Every secret is REQUIRED and has no default. `${VAR:?…}` makes `docker compose` refuse to
# start with a message naming what is missing, which is the point: the previous defaults were
# strings committed to this repository, so a deploy that forgot to set JWT_SECRET ran with a
# signing key anyone could read.
#
# Supply the values through the environment from AWS Secrets Manager / SSM at deploy time
# (`docker compose --env-file /etc/needy/needy.env …`, a root-only file written on the host).
# Never from a file in this repository.
#
# Only Caddy publishes ports. Postgres, Redis and the two app containers are reachable only on
# the compose network.

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the public hostname, e.g. needy.example.in}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL for certificate expiry notices}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Two roles. POSTGRES_USER owns the schema and is used only by the backend's migrations;
    # NEEDY_APP_DB_USER is what the backend serves traffic as, and may only SELECT and INSERT
    # on audit_log and abuse_signals (packages/backend/src/dbRoles.ts). The init script makes
    # that role on a NEW volume only. On an existing volume, create it once by hand:
    #   docker compose -f docker-compose.prod.yml exec -T postgres \
    #     sh /docker-entrypoint-initdb.d/10-runtime-role.sh
    # then restart the backend, which grants it its privileges at boot.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-needy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-needy}
      NEEDY_APP_DB_USER: ${NEEDY_APP_DB_USER:-needy_app}
      NEEDY_APP_DB_PASSWORD: ${NEEDY_APP_DB_PASSWORD:?set NEEDY_APP_DB_PASSWORD (different from POSTGRES_PASSWORD)}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    <<: *hardening
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Serves traffic as the least-privilege role; migrates as the owner, whose connections are
      # closed before the server listens. Boot refuses production if these are the same role,
      # or if the runtime role could UPDATE, DELETE or TRUNCATE the audit log. Both passwords
      # go into URLs, so generate them URL-safe (hex), or percent-encode them.
      DATABASE_URL: postgresql://${NEEDY_APP_DB_USER:-needy_app}:${NEEDY_APP_DB_PASSWORD:?set NEEDY_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-needy}
      DATABASE_MIGRATION_URL: postgresql://${POSTGRES_USER:-needy}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-needy}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to at least 32 random characters}
      # Only while rotating JWT_SECRET: the outgoing key, accepted for verification only.
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      KYC_CALLBACK_SECRET: ${KYC_CALLBACK_SECRET:?set KYC_CALLBACK_SECRET to at least 32 random characters}
      # Seals the staff authenticator-app secrets at rest. Long-lived: changing it makes every
      # enrolled authenticator stop verifying, so staff would have to enrol again.
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set TOTP_ENCRYPTION_KEY to at least 32 random characters}
      # Seal users' phone numbers and dates of birth at rest, and key the blind index phone
      # lookups match on. Two different values. The encryption key rotates through
      # PII_ENCRYPTION_KEYS_PREVIOUS; the index key must never change.
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?set PII_ENCRYPTION_KEY to at least 32 random characters}
      PII_ENCRYPTION_KEYS_PREVIOUS: ${PII_ENCRYPTION_KEYS_PREVIOUS:-}
      PII_INDEX_KEY: ${PII_INDEX_KEY:?set PII_INDEX_KEY to at least 32 random characters}
      # The one browser origin allowed to call the API — drives both CORS and the CSRF check.
      CORS_ORIGIN: https://${DOMAIN:?set DOMAIN}
      PUBLIC_BASE_URL: https://api.${DOMAIN:?set DOMAIN}
      # Exactly one proxy hop (Caddy) sits in front, so req.ip is the real client address and
      # the per-IP OTP limiter is not one shared bucket.
      TRUST_PROXY: "1"
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: strict
      # Real providers only. The backend refuses to boot in production on the sandbox KYC
      # adapter, the console SMS adapter's fixed code, or local-disk document storage, and
      # these have no defaults here so that refusal is never reached by accident.
      SMS_PROVIDER: ${SMS_PROVIDER:?set SMS_PROVIDER (twilio)}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      KYC_PROVIDER: ${KYC_PROVIDER:?set KYC_PROVIDER to a real provider}
      STORAGE_DRIVER: s3
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET (private, block public access, SSE-KMS)}
      S3_REGION: ${S3_REGION:-ap-south-1}
      # Optional, and meant to stay unset. With no static keys the backend signs S3 requests
      # with the EC2 instance role's short-lived credentials (IMDSv2), which rotate on their
      # own and never sit in an env file. Static keys still work — for a host with no role —
      # but the backend logs a warning on every production boot while they are set. See
      # deploy-ec2.sh for the instance profile and IMDS hop limit the role path needs.
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      DIRECTIONS_PROVIDER: ${DIRECTIONS_PROVIDER:-}
      DIRECTIONS_API_KEY: ${DIRECTIONS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The single Next.js app: marketing, signup/KYC, requester, helper and admin.
  # NEXT_PUBLIC_* are inlined by `next build`, so the API origin is a BUILD arg — setting it
  # as a runtime `environment:` entry would have no effect on the compiled bundle.
  web:
    <<: *hardening
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN:?set DOMAIN}
        NEXT_PUBLIC_SUPPORT_PHONE: ${SUPPORT_PHONE:-}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis-data:
  pg-data:
  caddy-data:
  caddy-config:
