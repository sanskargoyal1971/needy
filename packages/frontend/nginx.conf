server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Single-page app: any unknown path is a client route, not a 404. Without this, a user who
  # reloads while on /task/abc — which is exactly what happens during a live task — gets an
  # nginx error page instead of their task.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed assets are immutable; index.html must never be cached or a deploy won't take effect.
  location ~* \.(?:js|css|woff2?|png|jpg|svg)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Defence-in-depth headers. The API sets its own via helmet; these cover the static origin.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
}
